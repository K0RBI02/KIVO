[package]
name = "kivo"
version = "1.0.0"
description = "KIVO - persoenliche Wissens-Suchengine"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "kivo"
path = "src/main.rs"
